<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sketch</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="libraries/p5.min.js"></script>
  <script src="libraries/p5.sound.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.css" integrity="sha384-BTYW2YbaEIuKb0WnduFElGjiUxa55Yt6KOh9vGSOkqZ8L/l6rOxx85EW3XWx6jFE" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.js" integrity="sha384-gJ0qkZPTkmucpFVu0FoXqw4SRjnNnHiPj7uaF56Fn23UoLwa44b46aqhs/LPOFxD" crossorigin="anonymous"></script>
</head>

<body>
  <h4 class="version">V1.1.1</h4>
  <div class="questionText" contenteditable="true">Hello world</div>

  <div class="previousBtn"></div>
  <div class="forwardBtn"></div>
  <div id="control-panel" class="list">
    <label for="cameraX">Camera X</label>
    <input type="range" id="cameraX" name="cameraX" min="-500" max="500" value="0" step="1">
    <label for="cameraY">Camera Y</label>
    <input type="range" id="cameraY" name="cameraY" min="-500" max="500" value="0" step="1">

    <label for="cameraZ">Camera Z</label>
    <input type="range" id="cameraZ" name="cameraZ" min="-1000" max="1000" value="800" step="1">
    <button id="keyframe" type="button">Key Frame</button>
    <button id="play" type="button">Play</button>
    <button id="save" type="button">Save</button>
    <button id="reset" type="button">Reset</button>

    <label for="vector1heading">Vector 1 (heading):</label>
    <input type="number" id="vector1heading" name="Vector1heading" min="-100" max="100" step="1" value="1">
    <label for="vector1length">Vector 1 (length):</label>
    <input type="number" id="vector1length" name="Vector1length" min="-100" max="100" step="1" value="200">
    <label for="vector1z">Vector 1 (z-index):</label>
    <input type="number" id="vector1z" name="Vector1z" min="-500" max="500" step="1" value="0">
    <label for="vector2heading">Vector 2 (heading):</label>
    <input type="number" id="vector2heading" name="Vector2heading" min="-100" max="100" step="1" value="1">
    <label for="vector2length">Vector 2 (length):</label>
    <input type="number" id="vector2length" name="Vector2length" min="-100" max="100" step="1" value="200">
    <label for="vector2z">Vector 2 (z-index):</label>
    <input type="number" id="vector2z" name="Vector2z" min="-500" max="500" step="1" value="0">
    <label for="vector3heading">Vector 3 (heading):</label>
    <input type="number" id="vector3heading" name="Vector3heading" min="-100" max="100" step="1" value="1">
    <label for="vector3length">Vector 3 (length):</label>
    <input type="number" id="vector3length" name="Vector3length" min="-100" max="100" step="1" value="200">
    <label for="vector3z">Vector 3 (z-index):</label>
    <input type="number" id="vector3z" name="Vector3z" min="-500" max="500" step="1" value="0">
<label>A <input id="pAx" type="number" value="0"><input id="pAy" type="number" value="0"><input id="pAz" type="number" value="0"></label>
<label>B <input id="pBx" type="number" value="1"><input id="pBy" type="number" value="-1"><input id="pBz" type="number" value="2"></label>
<label>C <input id="pCx" type="number" value="0"><input id="pCy" type="number" value="3"><input id="pCz" type="number" value="-1"></label>
<label>D <input id="pDx" type="number" value="3"><input id="pDy" type="number" value="-4"><input id="pDz" type="number" value="1"></label>
<div id="volumeOutput"></div>
    <div>
      <label for="observerA">A as Observer</label>
      <input type="checkbox" id="observerA" name="observerA" value="observerA">
    </div>
    <div>
      <label for="observerB">B as Observer</label>
      <input type="checkbox" id="observerB" name="observerB" value="observerB">
    </div>
    <button id="addOperater">Add the two vectors</button>
    <button id="dotOperater">Dot product of the two vectors</button>
    <button id="crossOperater">Cross product of the two vectors</button>
    <button id="addSlide">Slide Blank Slide</button>
  </div>

  <script src="https://kit.fontawesome.com/87e6eea42a.js" crossorigin="anonymous"></script>
  <script src="sketch.js"></script>
  <script type="module" src="save.js"></script>

</body>

</html>
