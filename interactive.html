<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roller Coaster Viewer 3000</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--text:#1d1d1b;--muted:#6b6b66;--border:#d9d9d3;--accent:#2563eb;--accent-text:#fff;--cv:#e9e9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--panel:#222;--text:#ececea;--muted:#9a9a94;--border:#3a3a38;--accent:#5b8def;--accent-text:#0b0b0b;--cv:#101010}}
:root[data-theme="dark"]{--bg:#161616;--panel:#222;--text:#ececea;--muted:#9a9a94;--border:#3a3a38;--accent:#5b8def;--accent-text:#0b0b0b;--cv:#101010}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
label{color:var(--muted);font-size:12px}
input[type=number]{width:78px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
button,.btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
#cal{display:none;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 12px;gap:8px;align-items:center;flex-wrap:wrap}
#cal.on{display:flex}
#wrap{position:relative;flex:1;min-height:0;background:var(--cv)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.cal{cursor:crosshair}
#hud{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
#display{position:absolute; top:50%;left:25%;}
#display h1{font-size: 2rem; color: #1d1d1b;}
</style>
</head>
<body>
<div class="bar">
  <button id="openbtn">Open file…</button>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="grp">
    <input id="path" type="text" placeholder="or path, e.g. graph.png" style="width:170px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit">
    <button id="pathbtn">Load path</button>
     <label for="function">Enter Function:</label>
    <input type="text" id="function" placeholder="Type your function...">
  </div>
  <div class="grp">
    <label>x</label><input id="gx" type="number" step="any" value="0">
    <label>y</label><input id="gy" type="number" step="any" value="0">
    <button class="primary" id="go">Go to</button>
  </div>
  <div class="grp">
    <label>zoom</label><button id="zo">−</button><button id="zi">+</button>
    <button id="calbtn">Calibrate</button>
    <button id="playbtn">Play Animation</button>
  </div>
</div>
<div id="cal"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">Load your GeoGebra screenshot to begin</div>
</div>
<div id="display"><h1>hello world</h1></div>

<script src="interactive.js"></script>
</body>
</html>
